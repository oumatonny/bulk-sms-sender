name: bulk_sms_sender
description: "Bulk Messenger - send SMS through your phone's SIM to an imported contact list."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # File selection (Excel / CSV)
  file_picker: ^8.1.2

  # Excel (.xlsx) parsing
  excel: ^4.0.6

  # CSV parsing
  csv: ^6.0.0

  # Runtime permission requests (SEND_SMS, READ_PHONE_STATE)
  permission_handler: ^11.3.1

  # Local persistence: contacts, campaigns, settings
  shared_preferences: ^2.3.2

  # Unique ids for campaigns / results
  uuid: ^4.5.1

  # Lightweight app-wide state management (contacts, message, settings)
  provider: ^6.1.5+1

  # Date formatting for campaign history
  intl: ^0.19.0

  # Character handling for text input
  characters: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bulk_messenger_logo.png
